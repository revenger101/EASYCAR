<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out - Easycar</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2554/2554936.png" type="image/x-icon">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .logout-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .logout-icon {
            font-size: 3rem;
            color: #28a745;
            margin-bottom: 20px;
            animation: checkmark 0.6s ease-in-out;
        }
        .logout-title {
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 1.5rem;
        }
        .logout-message {
            color: #666;
            margin-bottom: 30px;
        }
        .spinner-border {
            color: #007bff;
        }
        .redirect-info {
            color: #999;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        @keyframes checkmark {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .logout-container {
            animation: fadeIn 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logout-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h2 class="logout-title">Successfully Logged Out</h2>
        <p class="logout-message">
            Thank you for using Easycar! Your session has been ended securely.
        </p>
        
        <div class="d-flex justify-content-center mb-3">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        
        <p class="redirect-info">
            Redirecting you to the login page in <span id="countdown">3</span> seconds...
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        // Clear all localStorage data
        function clearUserData() {
            try {
                // Clear specific Easycar user data
                localStorage.removeItem('easycar_user');
                
                // Clear any other app-specific data
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('easycar_')) {
                        keysToRemove.push(key);
                    }
                }
                
                // Remove all Easycar-related keys
                keysToRemove.forEach(key => localStorage.removeItem(key));
                
                console.log('User data cleared from localStorage');
            } catch (error) {
                console.error('Error clearing localStorage:', error);
            }
        }

        // Clear sessionStorage as well
        function clearSessionData() {
            try {
                // Clear specific session data
                const keysToRemove = [];
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key && key.startsWith('easycar_')) {
                        keysToRemove.push(key);
                    }
                }
                
                keysToRemove.forEach(key => sessionStorage.removeItem(key));
                console.log('Session data cleared');
            } catch (error) {
                console.error('Error clearing sessionStorage:', error);
            }
        }

        // Countdown and redirect
        function startCountdown() {
            let seconds = 3;
            const countdownElement = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                seconds--;
                countdownElement.textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(timer);
                    // Redirect to login page
                    window.location.href = '/login/';
                }
            }, 1000);
        }

        // Execute when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Clear all user data
            clearUserData();
            clearSessionData();
            
            // Start countdown
            startCountdown();
            
            // Also provide immediate redirect option
            document.addEventListener('click', function() {
                window.location.href = '/login/';
            });
            
            // Handle browser back button
            window.addEventListener('popstate', function() {
                window.location.href = '/login/';
            });
        });

        // Prevent going back to authenticated pages
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.href = '/login/';
            }
        });
    </script>
</body>
</html>
